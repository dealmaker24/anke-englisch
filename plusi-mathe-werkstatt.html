<title>Plusi Mathe-Werkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
/* Layout: eine Spalte wie ein Schulheft. Lösungswege stehen auf Karopapier, Plusi begleitet durch die Seiten. */
:root{
  --bg:#f2f5ff;--surface:#ffffff;--ink:#1b2547;--muted:#566089;--line:#d8dff4;
  --primary:#3a57f0;--on-primary:#ffffff;--sun:#ffc531;--on-sun:#2e2200;
  --good:#0b8a65;--good-bg:#d9f5ea;--bad:#c93a2d;--bad-bg:#ffe3df;--tip-bg:#fff3c9;
  --paper:#fffdf6;--grid:#d3dcf3;--margin:#f19a93;--hand:#26335f;
  --t1:#dfe6ff;--t2:#ffe0dc;--t3:#d5f4ea;--t4:#fff0c2;--t5:#ece0ff;--t6:#d3f1f5;
  --shadow:0 2px 0 rgba(27,37,71,.07),0 10px 24px rgba(27,37,71,.07);
  --f-display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-hand:'Patrick Hand','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1430;--surface:#172045;--ink:#eaeeff;--muted:#a5afd8;--line:#2a3568;
  --primary:#8aa0ff;--on-primary:#0e1430;--good:#46d9a8;--good-bg:#12382f;--bad:#ff8a7e;--bad-bg:#432228;--tip-bg:#3d3515;
  --paper:#1b2552;--grid:#2a3770;--margin:#8a4a5a;--hand:#e6ebff;
  --t1:#27348a;--t2:#5a2a33;--t3:#134638;--t4:#4d4116;--t5:#3c2d6e;--t6:#124650;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.25);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1430;--surface:#172045;--ink:#eaeeff;--muted:#a5afd8;--line:#2a3568;
  --primary:#8aa0ff;--on-primary:#0e1430;--good:#46d9a8;--good-bg:#12382f;--bad:#ff8a7e;--bad-bg:#432228;--tip-bg:#3d3515;
  --paper:#1b2552;--grid:#2a3770;--margin:#8a4a5a;--hand:#e6ebff;
  --t1:#27348a;--t2:#5a2a33;--t3:#134638;--t4:#4d4116;--t5:#3c2d6e;--t6:#124650;
  --shadow:0 2px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.25);color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--f-body);-webkit-text-size-adjust:100%;touch-action:manipulation}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0 0 .7em}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

.app{max-width:560px;margin:0 auto;padding-block:14px 104px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body.in-session .app{padding-bottom:40px}
#view{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--surface);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.eyebrow{font:700 13px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1 1 auto}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 24px;border:0;border-radius:18px;background:var(--primary);color:var(--on-primary);font:800 19px/1 var(--f-display);box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.sun{background:var(--sun);color:var(--on-sun)}
.btn.ghost{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 2.5px var(--primary)}
.btn.ghost:active{transform:none}
.btn.small{min-height:44px;padding:0 16px;font-size:16px;border-radius:14px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.linkbtn{background:none;border:0;color:var(--primary);font-weight:800;padding:10px 4px;min-height:44px;text-decoration:underline;text-underline-offset:3px}
.iconbtn{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:22px;height:22px}

/* Plusi + Sprechblase */
.hello{display:flex;gap:10px;align-items:flex-end}
.plusi{width:96px;height:96px;flex:none}
.plusi.sm{width:64px;height:64px}
.bubble{position:relative;background:var(--surface);border-radius:22px 22px 22px 6px;padding:14px 16px;box-shadow:var(--shadow);font-weight:700;min-width:0}
.bubble h1{font-size:26px;margin-bottom:4px}
.bubble p{margin:0;color:var(--muted);font-weight:600}
@media (prefers-reduced-motion:no-preference){.plusi.hop{animation:hop .7s ease-out}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-14px) rotate(-4deg)}70%{transform:translateY(0) rotate(3deg)}100%{transform:none}}

/* Werte-Zeile */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border-radius:18px;padding:12px 10px;text-align:center;box-shadow:var(--shadow);min-width:0}
.stat b{display:block;font:800 26px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:700;color:var(--muted)}
.stat svg{width:26px;height:26px;display:block;margin:0 auto 2px}
.lvl{background:var(--surface);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.lvl .top{display:flex;justify-content:space-between;gap:8px;font-weight:800;margin-bottom:8px}
.meter{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--sun)}

/* Tagesmission */
.mission{background:var(--primary);color:var(--on-primary);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.mission h2{font-size:28px}
.mission .eyebrow{color:inherit;opacity:.8}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px;padding:0;list-style:none}
.chips li{background:rgba(255,255,255,.2);border-radius:99px;padding:5px 12px;font-weight:800;font-size:15px}
:root[data-theme="dark"] .chips li{background:rgba(14,20,48,.16)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chips li{background:rgba(14,20,48,.16)}}
.mission .btn{background:var(--sun);color:var(--on-sun)}
.mission .btn.ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 2.5px currentColor}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.week div{font-size:13px;font-weight:800;color:var(--muted)}
.week i{display:grid;place-items:center;width:34px;height:34px;margin:4px auto 0;border-radius:50%;border:2.5px solid var(--line);font-style:normal;font-size:16px}
.week .on i{background:var(--good);border-color:var(--good);color:var(--surface)}
.week .today i{border-color:var(--primary)}

/* Listen */
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--line);border-radius:18px;padding:5px}
.seg button{min-height:46px;border:0;border-radius:14px;background:transparent;font:800 17px var(--f-display);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tlist{display:flex;flex-direction:column;gap:10px;padding:0;margin:0;list-style:none}
.titem{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--surface);border:0;border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);min-height:76px}
.glyph{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font:800 19px/1 var(--f-display);color:var(--ink)}
.tone1{background:var(--t1)}.tone2{background:var(--t2)}.tone3{background:var(--t3)}.tone4{background:var(--t4)}.tone5{background:var(--t5)}.tone6{background:var(--t6)}
.titem .tx{min-width:0;flex:1}
.titem b{display:block;font:800 19px/1.2 var(--f-display)}
.titem small{display:block;color:var(--muted);font-weight:600;font-size:14.5px}
.pips{display:flex;gap:4px;flex:none}
.pips i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.pips i.on{background:var(--sun)}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--primary);font-weight:800;min-height:44px;padding:0}

/* Erklärkarte und Heft */
.learn h2{font-size:24px;margin-bottom:8px}
.learn .fr{font-size:.95em}
.heft{position:relative;background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:1.5em 1.5em;border-radius:14px;padding:.75em 14px .75em 2.3em;font:21px/1.5em var(--f-hand);color:var(--hand);box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.heft::before{content:"";position:absolute;top:0;bottom:0;left:1.6em;width:2px;background:var(--margin)}
.heft ol,.heft ul{margin:0;padding:0;list-style:none}
.heft li{margin:0 0 .0em;overflow-wrap:anywhere}
.heft li+li{margin-top:.1em}
.heft .res{font-weight:400;text-decoration:underline wavy var(--good);text-underline-offset:5px;text-decoration-thickness:1.5px}
.heft .ex-h{color:var(--primary)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;margin:0 .15em;font-size:.88em}
.fr .n{border-bottom:2px solid currentColor;padding:0 .25em}
.fr .d{padding:0 .25em}
.expr{font-family:var(--f-display);font-size:1.25em;letter-spacing:.02em;white-space:nowrap;display:inline-block}

/* Aufgabe */
.s-head{display:flex;gap:12px;align-items:center}
.pbar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--good);border-radius:99px;transition:width .3s}
.count{font:800 16px var(--f-display);min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.task .tag{display:inline-block;padding:3px 12px;border-radius:99px;font-weight:800;font-size:14px;margin-bottom:10px;color:var(--ink)}
.q{font-size:20px;font-weight:700;line-height:1.5;margin-bottom:16px}
.q b{font-weight:800}
.ans{display:flex;align-items:center;gap:10px}
.ans input{flex:1;min-width:0;height:62px;border-radius:18px;border:3px solid var(--line);background:var(--bg);padding:0 16px;font:800 28px var(--f-display);font-variant-numeric:tabular-nums}
.ans input:focus{border-color:var(--primary);outline:none}
.ans .unit{font:800 20px var(--f-display);color:var(--muted)}
.fr-in{display:inline-flex;flex-direction:column;align-items:center;gap:6px}
.fr-in input{width:96px;height:56px;border-radius:16px;border:3px solid var(--line);background:var(--bg);text-align:center;font:800 26px var(--f-display)}
.fr-in input:focus{border-color:var(--primary);outline:none}
.fr-in hr{width:84px;border:0;border-top:4px solid var(--ink);margin:0;border-radius:2px}
.choices{display:grid;gap:10px}
.choice{min-height:60px;border-radius:18px;border:3px solid var(--line);background:var(--bg);font:800 24px var(--f-display);font-variant-numeric:tabular-nums}
.choice[aria-pressed="true"]{border-color:var(--primary);background:var(--t1)}
.choice.right{border-color:var(--good);background:var(--good-bg)}
.choice.wrong{border-color:var(--bad);background:var(--bad-bg)}
.chips:empty{display:none}
.actions{display:flex;gap:10px;margin-top:16px}
.actions .btn{flex:1}
.actions .btn.ghost{flex:0 0 auto}
.fb{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:18px;padding:12px 14px;font-weight:700}
.note .plusi{width:52px;height:52px}
.note.tip{background:var(--tip-bg)}
.note.good{background:var(--good-bg)}
.note.bad{background:var(--bad-bg)}
.note p{margin:0}
.earn{font:800 18px var(--f-display);display:inline-flex;gap:6px;align-items:center}
.earn svg{width:22px;height:22px}
details.solution summary{font-weight:800;color:var(--primary);min-height:44px;display:flex;align-items:center;cursor:pointer}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
.confirm{background:var(--bad-bg);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;font-weight:700}

/* Ergebnis */
.sum{text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.sum .plusi{width:128px;height:128px}
.sum h1{font-size:30px}
.big{font:800 54px/1 var(--f-display)}
.note-big{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font:800 54px/1 var(--f-display);background:var(--sun);color:var(--on-sun)}
.rlist{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none;text-align:left;width:100%}
.rlist li{display:flex;gap:10px;background:var(--bg);border-radius:14px;padding:10px 12px;align-items:flex-start}
.rlist .mk{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:var(--surface);margin-top:2px}
.rlist .ok .mk{background:var(--good)}
.rlist .no .mk{background:var(--bad)}
.rlist .tx{min-width:0;font-size:16px;font-weight:600}
.joke{background:var(--tip-bg);border-radius:18px;padding:14px 16px;text-align:left;font-weight:700;width:100%}

/* Badges, Fortschritt */
.badges{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0;margin:0;list-style:none}
.badge{display:flex;gap:10px;align-items:center;border-radius:18px;padding:10px 12px;background:var(--bg);min-width:0}
.badge .gl{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font:800 18px var(--f-display);background:var(--sun);color:var(--on-sun)}
.badge.locked .gl{background:transparent;border:2.5px dashed var(--line);color:var(--muted)}
.badge b{display:block;font-size:15px;line-height:1.2}
.badge small{display:block;font-size:13px;color:var(--muted);font-weight:600;line-height:1.25}
.prog{display:flex;flex-direction:column;gap:12px;padding:0;margin:0;list-style:none}
.prog li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center}
.prog b{font-size:15.5px}
.prog span.p{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px}
.prog .meter{grid-column:1/-1;height:10px}
.prog .meter i{background:var(--good)}
.prog .low .meter i{background:var(--bad)}
.prog .low .p{color:var(--bad)}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field label{font-weight:800}
.field input{height:54px;border-radius:16px;border:3px solid var(--line);background:var(--bg);padding:0 14px;font:700 20px var(--f-body)}
.field input:focus{border-color:var(--primary);outline:none}
.err-item{background:var(--bg);border-radius:14px;padding:10px 12px;font-size:16px;font-weight:600}
.err-item small{display:block;color:var(--muted);font-weight:700}
.empty{text-align:center;padding:8px 4px}
.empty .plusi{width:110px;height:110px;margin:0 auto 6px;display:block}

/* Tableiste */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
body.in-session #tabs{display:none}
#tabs .in{display:flex;max-width:560px;margin:0 auto}
#tabs button{flex:1;min-width:0;min-height:56px;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:800 12.5px var(--f-body);border-radius:14px}
#tabs svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="page"]{color:var(--primary);background:var(--t1)}
#tabs .dot{position:relative}
#tabs .dot b{position:absolute;top:-4px;right:-10px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}

@media (max-width:380px){.plusi{width:78px;height:78px}.bubble h1{font-size:22px}.q{font-size:18.5px}.glyph{width:48px;height:48px;font-size:16px}}

</style>

<script>
'use strict';
/* =====================================================================
   Aufgaben-Generatoren für Plusi Mathe-Werkstatt (Klasse 5 und 6)
   Reine Funktionen ohne DOM, damit sie per Node getestet werden können.
   ===================================================================== */

/* ---------- Zufall ---------- */
function xmur3(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);return(h^=h>>>16)>>>0;};}
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function makeRng(seed){return (seed===undefined||seed===null)?Math.random:mulberry32(xmur3(String(seed))());}
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1));
const pick=(r,a)=>a[Math.floor(r()*a.length)];
function shuffle(r,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
function divisorsOf(n){const o=[];for(let i=1;i<=n;i++)if(n%i===0)o.push(i);return o;}

/* ---------- Formatierung (deutsch) ---------- */
const NNBSP=' ';
function group(s){return s.length>=5?s.replace(/\B(?=(\d{3})+(?!\d))/g,NNBSP):s;}
function fmtInt(n){const neg=n<0;const s=group(String(Math.abs(Math.round(n))));return (neg?'−':'')+s;}
function fmtNum(x,maxDec){
  maxDec=maxDec===undefined?4:maxDec;
  if(Number.isInteger(x))return fmtInt(x);
  let s=String(Number(x.toFixed(maxDec)));
  const neg=s[0]==='-';if(neg)s=s.slice(1);
  const p=s.split('.');
  return (neg?'−':'')+group(p[0])+(p[1]?','+p[1]:'');
}
function euro(c){const neg=c<0;c=Math.abs(c);const e=Math.floor(c/100),ct=c%100;return (neg?'−':'')+fmtInt(e)+','+String(ct).padStart(2,'0')+' €';}
function fr(n,d){return '<span class="fr"><span class="n">'+n+'</span><span class="d">'+d+'</span></span>';}
const mn=x=>x<0?'−'+(-x):String(x); // Minuszeichen
const NAMES=['Mia','Ben','Lena','Paul','Emma','Noah','Lara','Finn','Ida','Jonas','Zoe','Elias'];
function names2(r){const a=pick(r,NAMES);let b=pick(r,NAMES);while(b===a)b=pick(r,NAMES);return [a,b];}
const PLACES=['Einer','Zehner','Hunderter','Tausender','Zehntausender','Hunderttausender'];

function T(o){return Object.assign({unit:'',tip:'',steps:[],neg:false,meta:{}},o);}

/* ---------- Schriftlich rechnen: Schritte ---------- */
function digitsRev(n){return String(n).split('').reverse().map(Number);}
function addSteps(a,b){
  const A=digitsRev(a),B=digitsRev(b),n=Math.max(A.length,B.length);
  let carry=0;const out=[];
  for(let i=0;i<n;i++){
    const da=A[i]||0,db=B[i]||0,s=da+db+carry,w=s%10,nc=Math.floor(s/10);
    out.push(PLACES[i]+': '+da+' + '+db+(carry?' + '+carry+' (Übertrag)':'')+' = '+s+' → ich schreibe '+w+(nc?' und merke mir '+nc:''));
    carry=nc;
  }
  if(carry)out.push('Ganz links: Der Übertrag '+carry+' wird vorne dazugeschrieben.');
  out.push('Ergebnis: '+fmtInt(a)+' + '+fmtInt(b)+' = '+fmtInt(a+b));
  return out;
}
function subSteps(a,b){
  const A=digitsRev(a),B=digitsRev(b);
  let borrow=0;const out=[];
  for(let i=0;i<A.length;i++){
    const da=A[i],db=B[i]||0,base=da-borrow;
    let line=PLACES[i]+': ';
    if(base>=db){
      line+=(borrow?da+' − 1 (geliehen) = '+base+'; ':'')+base+' − '+db+' = '+(base-db);
      borrow=0;
    }else if(base<0){
      line+=da+' − 1 (geliehen) geht nicht, also leihe ich 10: 9 − '+db+' = '+(9-db);
      borrow=1;
    }else{
      line+=(borrow?da+' − 1 (geliehen) = '+base+'. ':'')+base+' − '+db+' geht nicht, also leihe ich 10: '+(base+10)+' − '+db+' = '+(base+10-db);
      borrow=1;
    }
    out.push(line);
  }
  out.push('Ergebnis: '+fmtInt(a)+' − '+fmtInt(b)+' = '+fmtInt(a-b));
  return out;
}
function moveSteps(start,delta){
  const res=start+delta,out=[];
  if(delta>=0){
    if(start<0&&res>=0){
      out.push('Von '+mn(start)+' bis 0 sind es '+(-start)+' Schritte nach rechts.');
      out.push('Es bleiben '+delta+' − '+(-start)+' = '+res+' Schritte über die Null hinaus.');
    }else out.push('Du gehst '+delta+' Schritte nach rechts auf dem Zahlenstrahl: '+mn(start)+' + '+delta+' = '+mn(res)+'.');
  }else{
    const d=-delta;
    if(start>=0&&res<0){
      out.push('Von '+start+' bis 0 sind es '+start+' Schritte nach links.');
      out.push('Es bleiben '+d+' − '+start+' = '+(d-start)+' Schritte unter die Null.');
    }else out.push('Du gehst '+d+' Schritte nach links: '+mn(start)+' − '+d+' = '+mn(res)+'.');
  }
  out.push('Ergebnis: '+mn(res));
  return out;
}

    const p1=ri(r,10,179)*5,p2=ri(r,10,179)*5;cents=p1+p2;
    q='Ein Heft kostet '+euro(p1)+' und ein Stift '+euro(p2)+'. Wie viel kosten beide zusammen?';
    steps=['Schriftlich rechnen, Komma unter Komma:','In Cent: '+p1+' ct + '+p2+' ct = '+(p1+p2)+' ct','Ergebnis: '+euro(p1+p2)];
    tip='Schreibe die Zahlen so untereinander, dass Komma unter Komma steht. Oder rechne in Cent.';
  }else if(v===2){
    const pay=pick(r,[5,10,20])*100;const total=ri(r,30,Math.floor((pay-20)/5))*5;cents=pay-total;
    q='Dein Einkauf kostet '+euro(total)+'. Du bezahlst mit '+(pay/100)+' €. Wie viel Rückgeld bekommst du?';
    steps=['Rechne in Cent: '+(pay/100)+' € = '+pay+' ct','Rückgeld = bezahlt − Preis: '+pay+' − '+total+' = '+(pay-total)+' ct','Ergebnis: '+euro(pay-total)];
    tip='Rückgeld ist das, was vom bezahlten Geld nach dem Abziehen des Preises übrig bleibt.';
  }else{
    const n=ri(r,2,6),share=ri(r,8,80)*5;const total=share*n;cents=share;
    q=n+' Freunde teilen sich eine Rechnung über '+euro(total)+' gerecht. Wie viel zahlt jeder?';
    steps=['In Cent: '+euro(total)+' = '+total+' ct',total+' : '+n+' = '+share+' ct','Ergebnis: '+euro(share)];
    tip='Teile den Gesamtbetrag durch die Anzahl der Freunde. Rechnen in Cent hilft.';
  }
  return T({kind:'num',q,ans:cents/100,unit:'€',tip,steps,meta:{v,cents}});
}

function gen_percent(r){
  const v=ri(r,0,2);
  if(v<2){
    let base,p;do{base=ri(r,1,10)*20;p=pick(r,[5,10,20,25,50]);}while((base*p)%100!==0);
    const sav=base*p/100,item=pick(r,['Rucksack','Paar Turnschuhe','Fahrrad-Helm','Buch']);
    const one=base/100;
    const st=['1 % von '+base+' € sind '+base+' : 100 = '+fmtNum(one)+' €',p+' % sind also '+p+' · '+fmtNum(one)+' € = '+fmtNum(sav)+' €'];
    if(v===0)return T({kind:'num',q:'Ein '+item+' kostet '+base+' €. Im Sale gibt es '+p+' % Rabatt. Wie viel Euro sparst du?',ans:sav,unit:'€',
      tip:'Erst 1 % ausrechnen (durch 100 teilen), dann mal '+p+'. Leichte Abkürzungen: 50 % = Hälfte, 25 % = Viertel, 10 % = durch 10.',steps:st,meta:{v,base,p}});
    st.push('Neuer Preis: '+base+' − '+fmtNum(sav)+' = '+fmtNum(base-sav)+' €');
    return T({kind:'num',q:'Ein '+item+' kostet '+base+' €. Im Sale gibt es '+p+' % Rabatt. Wie viel Euro kostet es jetzt?',ans:base-sav,unit:'€',
      tip:'Rechne zuerst den Rabatt in Euro aus und ziehe ihn dann vom alten Preis ab.',steps:st,meta:{v,base,p}});
  }
  let g,p,w;do{g=pick(r,[20,25,40,50,80,100,200]);p=pick(r,[5,10,20,25,50,75]);w=g*p/100;}while(!Number.isInteger(w)||w<1);
  return T({kind:'num',q:'Beim Schulfest wurden '+g+' Lose verkauft. '+w+' davon waren Gewinne. Wie viel Prozent der Lose waren Gewinne?',ans:p,unit:'%',
    tip:'Schreibe als Bruch '+fr(w,g)+' und bringe ihn auf den Nenner 100. Oder rechne '+w+' : '+g+' und dann mal 100.',
    steps:['Als Bruch: '+fr(w,g),w+' : '+g+' = '+fmtNum(w/g),fmtNum(w/g)+' · 100 = '+p,'Ergebnis: '+p+' %'],meta:{v,g,w,p}});
}

function gen_proportional(r){
  const v=ri(r,0,2);
  if(v===0){
    const pc=ri(r,4,40)*5,n1=ri(r,2,6),n2=ri(r,n1+2,12),t1=pc*n1;
    const item=pick(r,['Brezeln','Äpfel','Eisbecher','Bleistifte']);
    return T({kind:'num',q:n1+' '+item+' kosten zusammen '+euro(t1)+'. Wie viel kosten '+n2+' '+item+'?',ans:pc*n2/100,unit:'€',
      tip:'Dreisatz: Rechne erst aus, was 1 Stück kostet. Danach mal '+n2+'.',
      steps:[n1+' Stück → '+euro(t1),'1 Stück → '+euro(t1)+' : '+n1+' = '+euro(pc),n2+' Stück → '+euro(pc)+' · '+n2+' = '+euro(pc*n2)],meta:{v,pc,n1,n2}});
  }
  if(v===1){
    const per=pick(r,[50,75,100,125]),n1=pick(r,[2,4]),n2=pick(r,[6,8,10]),a1=per*n1;
    return T({kind:'num',q:'Für '+n1+' Personen braucht Papa '+a1+' g Nudeln. Wie viel Gramm Nudeln braucht er für '+n2+' Personen?',ans:per*n2,unit:'g',
      tip:'Wie viel Nudeln braucht eine einzige Person? Von dort aus rechnest du weiter.',
      steps:[n1+' Personen → '+a1+' g','1 Person → '+a1+' g : '+n1+' = '+per+' g',n2+' Personen → '+per+' g · '+n2+' = '+(per*n2)+' g'],meta:{v,per,n1,n2}});
  }
  const sp=pick(r,[12,15,18,20,24]),t1=ri(r,2,4),t2=ri(r,t1+1,8),d1=sp*t1;
  return T({kind:'num',q:'Lena radelt gleichmäßig. In '+t1+' Stunden schafft sie '+d1+' km. Wie weit kommt sie in '+t2+' Stunden?',ans:sp*t2,unit:'km',
    tip:'Wie weit fährt Lena in einer einzigen Stunde? Das ist dein Zwischenschritt.',
    steps:[t1+' Stunden → '+d1+' km','1 Stunde → '+d1+' km : '+t1+' = '+sp+' km',t2+' Stunden → '+sp+' km · '+t2+' = '+(sp*t2)+' km'],meta:{v,sp,t1,t2}});
}

function gen_negative(r){
  const v=ri(r,0,3);let q,ans,unit='',steps,tip;
  if(v===0){const s=ri(r,-12,-2),d=ri(r,3,16);ans=s+d;unit='°C';
    q='Am Morgen zeigt das Thermometer '+mn(s)+' °C. Bis Mittag steigt die Temperatur um '+d+' Grad. Wie warm ist es mittags?';
    steps=moveSteps(s,d);tip='Zeichne dir einen Zahlenstrahl. Steigen heißt: nach rechts gehen.';}
  else if(v===1){const s=ri(r,-3,10),d=ri(r,4,18);ans=s-d;unit='°C';
    q='Am Nachmittag sind es '+mn(s)+' °C. Bis Mitternacht sinkt die Temperatur um '+d+' Grad. Wie kalt ist es dann?';
    steps=moveSteps(s,-d);tip='Sinken heißt: auf dem Zahlenstrahl nach links gehen. Gehe erst bis zur Null.';}
  else if(v===2){const lo=ri(r,-14,-2),hi=ri(r,2,15);ans=hi-lo;unit='Grad';
    q='Nachts hatte es '+mn(lo)+' °C, tagsüber '+hi+' °C. Wie viele Grad liegen dazwischen?';
    steps=['Von '+mn(lo)+' bis 0: '+(-lo)+' Grad','Von 0 bis '+hi+': '+hi+' Grad',(-lo)+' + '+hi+' = '+ans,'Ergebnis: '+ans];tip='Der Weg von der kälteren zur wärmeren Temperatur führt über die Null.';}
  else{let debt=ri(r,2,20),gain=ri(r,2,25);if(gain===debt)gain++;ans=gain-debt;unit='€';
    q='Ben schuldet Paul '+debt+' €. Sein Kontostand bei Paul ist also '+mn(-debt)+' €. Zum Geburtstag bekommt Ben '+gain+' € geschenkt und gibt Paul alles. Wie hoch ist sein Kontostand danach?';
    steps=moveSteps(-debt,gain);tip='Schulden sind negative Zahlen. Geld dazubekommen heißt: nach rechts auf dem Zahlenstrahl.';}
  return T({kind:'num',q,ans,unit,tip,steps,neg:true,meta:{v}});
}

function gen_mean(r){
  const median=r()<0.35;
  const n=median?5:ri(r,4,6);
  let m,vals;
  for(let t=0;t<200;t++){
    m=ri(r,6,20);vals=[];let s=0;
    for(let i=0;i<n-1;i++){const x=ri(r,Math.max(1,m-5),m+5);vals.push(x);s+=x;}
    const last=n*m-s;
    if(last>=1&&last<=m+9){vals.push(last);break;}
    vals=null;
  }
  if(!vals){m=10;vals=[8,12,9,11,10,10].slice(0,n);const s=vals.reduce((a,b)=>a+b,0);vals[n-1]+=n*m-s;}
  vals=shuffle(r,vals);
  const ctx=pick(r,[
    {t:'Lena erzielt in '+n+' Spielrunden diese Punkte',u:'Punkte'},
    {t:'Paul liest an '+n+' Tagen jeweils so viele Minuten',u:'Minuten'},
    {t:'Mia sammelt in '+n+' Wochen diese Anzahl Pfandflaschen',u:'Flaschen'}
  ]);
  const sorted=vals.slice().sort((a,b)=>a-b),sum=vals.reduce((a,b)=>a+b,0);
  if(median){
    return T({kind:'num',q:'Pauls Wurfergebnisse in 5 Runden: '+vals.join(', ')+'. Welcher Wert ist der <b>Median</b> (der mittlere Wert, wenn man alle der Größe nach ordnet)?',ans:sorted[2],
      tip:'Ordne die Zahlen vom kleinsten zum größten Wert. Der Median steht genau in der Mitte.',
      steps:['Ordnen: '+sorted.join(', '),'Bei 5 Werten ist der 3. Wert in der Mitte.','Median: '+sorted[2]],meta:{median:true,vals}});
  }
  return T({kind:'num',q:ctx.t+': '+vals.join(', ')+'. Wie viele '+ctx.u+' sind das im <b>Durchschnitt</b> (Mittelwert) pro Runde, Tag oder Woche?',ans:m,
    tip:'Mittelwert: Zuerst alle Werte addieren, dann durch die Anzahl der Werte teilen.',
    steps:['Alles addieren: '+vals.join(' + ')+' = '+sum,'Durch die Anzahl ('+n+') teilen: '+sum+' : '+n+' = '+m,'Durchschnitt: '+m],meta:{median:false,vals}});
}

function gen_geometry(r){
  const v=ri(r,0,4);
  if(v===0){
    let l,b,h,V,t=0;do{l=pick(r,[40,50,60,80,100]);b=pick(r,[20,25,30,40,50]);h=pick(r,[20,25,30,40]);V=l*b*h;t++;}while(V%1000!==0&&t<200);
    if(V%1000!==0){l=50;b=30;h=40;V=60000;}
    return T({kind:'num',q:'Ein Aquarium ist '+l+' cm lang, '+b+' cm breit und '+h+' cm hoch. Wie viele Liter Wasser passen höchstens hinein? (1 l = 1000 cm³)',ans:V/1000,unit:'l',
      tip:'Volumen eines Quaders: Länge · Breite · Höhe. Danach von cm³ in Liter umrechnen.',
      steps:['Volumen = Länge · Breite · Höhe',l+' · '+b+' · '+h+' = '+fmtInt(V)+' cm³','1 l = 1000 cm³, also '+fmtInt(V)+' : 1000 = '+(V/1000)+' l'],meta:{v,l,b,h}});
  }
  if(v===1){
    const l=ri(r,3,12),b=ri(r,2,9),h=ri(r,2,8);
    return T({kind:'num',q:'Ein Schuhkarton ist '+l+' cm lang, '+b+' cm breit und '+h+' cm hoch. Wie groß ist sein Volumen?',ans:l*b*h,unit:'cm³',
      tip:'Volumen eines Quaders: Länge mal Breite mal Höhe.',steps:['Volumen = Länge · Breite · Höhe',l+' · '+b+' = '+(l*b),(l*b)+' · '+h+' = '+(l*b*h),'Ergebnis: '+(l*b*h)+' cm³'],meta:{v,l,b,h}});
  }
  if(v===2){
    const s=ri(r,2,7);
    return T({kind:'num',q:'Ein Würfel hat die Kantenlänge '+s+' cm. Wie groß ist sein Volumen?',ans:s*s*s,unit:'cm³',
      tip:'Beim Würfel sind Länge, Breite und Höhe gleich: Kante · Kante · Kante.',steps:['Volumen = Kante · Kante · Kante',s+' · '+s+' = '+(s*s),(s*s)+' · '+s+' = '+(s*s*s)],meta:{v,s}});
  }
  if(v===3){
    let a,b;do{a=ri(r,30,80);b=ri(r,30,90);}while(a+b>150);
    return T({kind:'num',q:'In einem Dreieck sind zwei Winkel '+a+'° und '+b+'° groß. Wie groß ist der dritte Winkel?',ans:180-a-b,unit:'°',
      tip:'Die Winkel in jedem Dreieck ergeben zusammen 180°.',steps:['Winkelsumme im Dreieck: 180°',a+'° + '+b+'° = '+(a+b)+'°','180° − '+(a+b)+'° = '+(180-a-b)+'°'],meta:{v,a,b}});
  }
  const a=ri(r,60,120),b=ri(r,60,120),c=ri(r,50,120),s=a+b+c;
  return T({kind:'num',q:'In einem Viereck sind drei Winkel '+a+'°, '+b+'° und '+c+'° groß. Wie groß ist der vierte Winkel?',ans:360-s,unit:'°',
    tip:'Die Winkel in jedem Viereck ergeben zusammen 360°.',steps:['Winkelsumme im Viereck: 360°',a+'° + '+b+'° + '+c+'° = '+s+'°','360° − '+s+'° = '+(360-s)+'°'],meta:{v,a,b,c}});
}

function gen_gcd_lcm(r){
  if(r()<0.5){
    let a,b;do{a=ri(r,3,12);b=ri(r,3,12);}while(a===b||a%b===0||b%a===0||lcm(a,b)>72);
    const L=lcm(a,b);
    const list=x=>{const o=[];for(let i=x;i<=L;i+=x)o.push(i);return o.join(', ');};
    return T({kind:'num',q:'Bus A fährt alle '+a+' Minuten, Bus B alle '+b+' Minuten. Um 8:00 Uhr starten beide zusammen. Nach wie vielen Minuten treffen sie sich wieder an der Haltestelle?',ans:L,unit:'min',
      tip:'Schreibe die Vielfachen beider Zahlen auf. Die erste Zahl, die in beiden Listen vorkommt, ist das kleinste gemeinsame Vielfache (kgV).',
      steps:['Vielfache von '+a+': '+list(a),'Vielfache von '+b+': '+list(b),'Die erste gemeinsame Zahl: '+L+' (das kgV).','Nach '+L+' Minuten treffen sie sich wieder.'],meta:{kind:'lcm',a,b}});
  }
  let g0,p,qq,x,y;
  do{g0=ri(r,2,9);p=ri(r,2,6);qq=ri(r,2,6);x=g0*p;y=g0*qq;}while(p===qq||gcd(p,qq)!==1||Math.max(x,y)>60||p===1||qq===1);
  if(x>y){const t=x;x=y;y=t;}
  const G=gcd(x,y);
  return T({kind:'num',q:'Auf dem Markt liegen '+x+' Äpfel und '+y+' Birnen. Sie sollen auf möglichst viele gleiche Körbe verteilt werden. In jedem Korb liegen von beiden Sorten gleich viele, nichts bleibt übrig. Wie viele Körbe sind es?',ans:G,unit:'Körbe',
    tip:'Gesucht ist die größte Zahl, die in beide Zahlen ohne Rest hineinpasst: der größte gemeinsame Teiler (ggT).',
    steps:['Teiler von '+x+': '+divisorsOf(x).join(', '),'Teiler von '+y+': '+divisorsOf(y).join(', '),'Der größte gemeinsame Teiler (ggT) ist '+G+'.','Es sind also '+G+' Körbe.'],meta:{kind:'gcd',a:x,b:y}});
}

/* ---------- Eingabe prüfen ---------- */
function parseNum(s){
  if(s===null||s===undefined)return NaN;
  s=String(s).trim().replace(/[−–‒]/g,'-').replace(/[\s   ]/g,'');
  if(!s)return NaN;
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  else s=s.replace(',','.');
  if(!/^-?\d+(\.\d+)?$/.test(s))return NaN;
  return parseFloat(s);
}
function checkAnswer(task,given){
  if(task.kind==='num'){
    const v=parseNum(given);
    if(isNaN(v))return 'invalid';
    return Math.abs(v-task.ans)<=1e-6*Math.max(1,Math.abs(task.ans))?'ok':'wrong';
  }
  if(task.kind==='frac'){
    const n=parseInt(given&&given.n,10),d=parseInt(given&&given.d,10);
    if(!Number.isFinite(n)||!Number.isFinite(d)||d===0)return 'invalid';
    if(n*task.ans.d!==d*task.ans.n)return 'wrong';
    return (n===task.ans.n&&d===task.ans.d)?'ok':'almost';
  }
  if(given===null||given===undefined)return 'invalid';
  return given===task.ans?'ok':'wrong';
}
function answerHtml(task){
  if(task.kind==='num'){
    const s=task.unit==='€'?task.ans.toFixed(2).replace('.',',').replace('-','−'):fmtNum(task.ans);
    return s+(task.unit?' '+task.unit:'');
  }
  if(task.kind==='frac')return fr(task.ans.n,task.ans.d);
  return task.choices[task.ans];
}

/* ---------- Test-Note ---------- */
function noteFor(ok,n){
  const p=ok/n;
  return p>=0.9?1:p>=0.75?2:p>=0.6?3:p>=0.45?4:p>=0.2?5:6;
}

}

  if(!S.errors.length)return h+'<section class="card empty">'+plusi('cheer')+'<h2>Keine offenen Fehler</h2><p class="muted">Plusi ist stolz auf dich. Fehler, die in Mission, Üben oder Probe auftauchen, erscheinen hier.</p></section>';
  h+='<button class="btn block" data-act="errs">Fehler üben ('+Math.min(5,S.errors.length)+' Aufgaben)</button>';
  h+='<ul class="tlist">'+S.errors.slice().reverse().map(e=>'<li class="err-item"><small>'+esc(TOPIC[e.topic].title)+'</small>'+esc(e.q.length>140?e.q.slice(0,140)+'…':e.q)+'<small style="margin-top:4px">Richtig war: '+esc(e.a)+'</small></li>').join('')+'</ul>';
  return h;
}

function badgeList(){
  const b=S.badges;
  return[
    {g:'1',n:'Erste Mission',d:'Eine Tagesmission geschafft',ok:b.missions>=1},
    {g:'3',n:'3 Tage Serie',d:'3 Tage hintereinander geübt',ok:S.best>=3},
    {g:'7',n:'Wochen-Held',d:'7 Tage hintereinander',ok:S.best>=7},
    {g:'50',n:'50 Sterne',d:'50 Sterne gesammelt',ok:S.stars>=50},
    {g:'200',n:'200 Sterne',d:'200 Sterne gesammelt',ok:S.stars>=200},
    {g:'1',n:'Note 1',d:'Probe mit Note 1',ok:b.note1>=1},
    {g:'✓',n:'Fehler-Retter',d:'5 Fehler weggestrichen',ok:b.cleared>=5}
  ];
}
function awardsView(){
  const lv=levelOf(S.stars);
  let h='<div><h1 style="font-size:30px;margin-bottom:4px">Erfolge</h1></div>';
  h+='<section class="hello">'+plusi('cheer')+'<div class="bubble"><h1 style="font-size:22px">'+lv.name+'</h1><p>'+S.stars+' Sterne gesammelt'+(lv.next?'. Noch '+(lv.next-S.stars)+' bis zum nächsten Level.':'.')+'</p></div></section>';
  h+='<section class="card"><h2 style="font-size:22px;margin-bottom:10px">Abzeichen</h2><ul class="badges">'+badgeList().map(b=>'<li class="badge'+(b.ok?'':' locked')+'"><span class="gl">'+b.g+'</span><span><b>'+b.n+'</b><small>'+b.d+(b.ok?'':' (noch offen)')+'</small></span></li>').join('')+'</ul></section>';
  h+='<section class="card"><h2 style="font-size:22px;margin-bottom:4px">Lernstand nach Themen</h2><p class="muted" style="font-size:15px">Für Eltern: Anteil richtiger Antworten in den letzten 10 Aufgaben je Thema. Rot heißt: lohnt sich zu wiederholen.</p><ul class="prog">'+TOPICS.map(t=>{const ms=mastery(t.id);const low=ms.pct!==null&&ms.pct<60;return '<li class="'+(low?'low':'')+'"><b>Kl. '+t.grade+' · '+esc(t.title)+'</b><span class="p">'+(ms.pct===null?'noch offen':ms.pct+' %'+(low?' · wiederholen':''))+'</span><div class="meter"><i style="width:'+(ms.pct||0)+'%"></i></div></li>';}).join('')+'</ul></section>';
  h+='<section class="card"><h2 style="font-size:22px;margin-bottom:10px">Profil</h2><div class="field"><label for="pname">Name</label><input id="pname" type="text" maxlength="20" autocomplete="off" value="'+esc(S.name)+'" placeholder="Dein Vorname"></div>'+gradeSeg('setgrade-draft',S.grade)+'<div style="height:12px"></div><button class="btn block" data-act="saveprofile">Speichern</button>';
  h+=confirmReset?'<div class="confirm" style="margin-top:14px"><span>Wirklich alles löschen? Sterne, Serie und Fehlerheft sind dann weg.</span><div class="row"><button class="btn small" data-act="resetyes" style="background:var(--bad);color:#fff">Ja, löschen</button><button class="btn small ghost" data-act="resetno">Abbrechen</button></div></div>':'<button class="linkbtn" style="margin-top:8px" data-act="resetask">Lernstand zurücksetzen</button>';
  h+='</section>';
  return h;
}

/* ---------- Lernrunde ---------- */
function startSession(mode,tasks,meta){
  if(!tasks.length){return;}
  sess=Object.assign({mode,tasks,i:0,res:[],phase:'ask',tries:0,hint:false,sel:null,stars:0,lv0:levelOf(S.stars).i,done:false},meta||{});
  render();window.scrollTo(0,0);
}
const cur=()=>sess.tasks[sess.i];
const isTest=()=>sess.mode==='test';
const modeTitle=()=>({mission:'Tagesmission',bonus:'Bonus-Runde',practice:'Üben',errors:'Fehlerheft',test:'Probe-Arbeit'})[sess.mode];

function renderSession(){
  if(sess.done)return renderSummary();
  const t=cur(),n=sess.tasks.length,tp=TOPIC[t.topic],last=sess.i===n-1,test=isTest();
  let input='';
  if(t.kind==='num'){
    input='<div class="ans">'+(t.neg?'<button class="btn ghost small" data-act="minus" aria-label="Minuszeichen einfügen" style="min-width:52px;padding:0">−</button>':'')+'<input id="ans" type="text" inputmode="'+(t.neg?'text':'decimal')+'" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Deine Antwort" placeholder="?"><span class="unit">'+t.unit+'</span></div>';
  }else if(t.kind==='frac'){
    input='<div class="row" style="justify-content:center"><div class="fr-in"><input id="an" inputmode="numeric" autocomplete="off" aria-label="Zähler" placeholder="Zähler"><hr><input id="ad" inputmode="numeric" autocomplete="off" aria-label="Nenner" placeholder="Nenner"></div></div>';
  }else{
    input='<div class="choices">'+t.choices.map((c,i)=>'<button class="choice" data-act="pick" data-i="'+i+'" aria-pressed="false">'+c+'</button>').join('')+'</div>';
  }
  $('#view').innerHTML=
    '<header class="s-head"><button class="iconbtn" data-act="quit" aria-label="Runde beenden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="'+n+'" aria-valuenow="'+sess.i+'"><i style="width:'+Math.round(sess.i/n*100)+'%"></i></div><span class="count">'+(sess.i+1)+' / '+n+'</span></header>'+
    '<div class="confirm" id="quit" hidden><span>Runde wirklich beenden? Der Fortschritt dieser Runde geht verloren.</span><div class="row"><button class="btn small" data-act="quityes" style="background:var(--bad);color:#fff">Beenden</button><button class="btn small ghost" data-act="quitno">Weitermachen</button></div></div>'+
    '<article class="card task"><span class="tag tone'+tp.tone+'">'+esc(modeTitle())+' · '+esc(tp.title)+'</span><div class="q">'+t.q+'</div>'+input+
    '<div class="actions" id="actAsk">'+(test?'':'<button class="btn ghost" data-act="tip">Tipp</button>')+'<button class="btn" data-act="check">'+(test?(last?'Abgeben':'Weiter'):'Prüfen')+'</button></div>'+
    '<div class="actions" id="actNext" hidden><button class="btn sun" data-act="next">'+(last?'Fertig':'Weiter')+'</button></div>'+
    (test?'':'<div style="text-align:center"><button class="linkbtn" id="showBtn" data-act="show">Ich komme nicht weiter. Lösungsweg zeigen</button></div>')+
    '<div class="fb" id="fb" aria-live="polite"></div></article>';
  const f=$('#ans')||$('#an');if(f&&!matchMedia('(pointer:coarse)').matches)f.focus();else if(f)f.focus({preventScroll:true});
}
function setFb(h){$('#fb').innerHTML=h;const fb=$('#fb');if(fb.scrollIntoView)fb.scrollIntoView({block:'nearest'});}
function readInput(t){
  if(t.kind==='num')return $('#ans').value;
  if(t.kind==='frac')return{n:$('#an').value.replace(/\D/g,''),d:$('#ad').value.replace(/\D/g,'')};
  return sess.sel;
}
function nudge(){const c=document.querySelector('.task');if(c){c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');}}

function submit(){
  if(!sess||sess.phase!=='ask'||sess.done)return;
  const t=cur(),given=readInput(t),verdict=checkAnswer(t,given);
  if(verdict==='invalid'){nudge();const f=$('#ans')||$('#an');if(f)f.focus();
    if(!isTest())setFb('<div class="note tip">'+plusi('think')+'<p>'+(t.kind==='choice'?'Wähle erst eine Antwort aus.':t.kind==='frac'?'Trage Zähler und Nenner mit Zahlen ein.':'Schreibe eine Zahl in das Feld.')+'</p></div>');return;}
  if(isTest()){sess.res.push({task:t,ok:verdict==='ok',given});return advance();}
  if(verdict==='ok'){finishTask(true,sess.tries===0?(sess.hint?2:3):1);}
  else if(verdict==='almost'){setFb('<div class="note tip">'+plusi('think')+'<p>Der Wert stimmt schon! Aber der Bruch lässt sich noch weiter kürzen. Kürze ihn ganz und prüfe nochmal.</p></div>');}
  else{
    sess.tries++;nudge();
    if(sess.tries>=2)finishTask(false,0);
    else{sess.hint=true;setFb('<div class="note bad">'+plusi('oops')+'<p>'+pick1(OOPS1)+'</p></div><div class="note tip" id="tipNote">'+plusi('think')+'<p><b>Tipp:</b> '+t.tip+'</p></div>');}
  }
}
function showTip(){
  if(!sess||sess.phase!=='ask'||isTest()||$('#tipNote'))return;
  sess.hint=true;const fb=$('#fb');fb.insertAdjacentHTML('beforeend','<div class="note tip" id="tipNote">'+plusi('think')+'<p><b>Tipp:</b> '+cur().tip+'</p></div>');
}
function showSolution(){
  if(!sess||sess.phase!=='ask'||isTest())return;
  finishTask(false,0,true);
}
function finishTask(ok,stars,gaveUp){
  const t=cur();
  sess.phase='done';sess.res.push({task:t,ok,stars});
  record(t,ok);
  if(ok){S.stars+=stars;sess.stars+=stars;if(t.errId)clearError(t.errId);}
  else if(sess.mode!=='errors')addError(t);
  save();
  document.querySelectorAll('#view input').forEach(i=>{i.disabled=true;});
  document.querySelectorAll('.choice').forEach((b,i)=>{b.disabled=true;if(t.kind==='choice'){if(i===t.ans)b.classList.add('right');else if(i===sess.sel)b.classList.add('wrong');}});
  $('#actAsk').hidden=true;const sb=$('#showBtn');if(sb)sb.hidden=true;$('#actNext').hidden=false;
  if(ok)setFb('<div class="note good">'+plusi('cheer','hop')+'<div><p>'+pick1(CHEER)+'</p><span class="earn">'+STAR+'+'+stars+(stars===1?' Stern':' Sterne')+'</span></div></div><details class="solution"><summary>Rechenweg ansehen</summary>'+heft(t.steps)+'</details>');
  else setFb('<div class="note bad">'+plusi('oops')+'<p>'+(gaveUp?'Hier ist der Lösungsweg. Lies ihn Schritt für Schritt.':pick1(OOPS2))+'</p></div><p style="margin:0">Richtig ist: <b>'+answerHtml(t)+'</b></p>'+heft(t.steps));
  const nb=document.querySelector('[data-act="next"]');if(nb)nb.focus({preventScroll:true});
}
function advance(){
  sess.i++;sess.phase='ask';sess.tries=0;sess.hint=false;sess.sel=null;
  if(sess.i>=sess.tasks.length)return finishSession();
  renderSession();window.scrollTo(0,0);
}
function completeMission(ok,n){
  const t=todayStr();
  if(S.days[t]&&S.days[t].done)return false;
  S.streak=(S.lastDay===dstr(daysAgo(1)))?S.streak+1:1;
  S.lastDay=t;S.best=Math.max(S.best,S.streak);S.badges.missions++;S.stars+=5;
  S.days[t]={done:true,ok,n};
  const keys=Object.keys(S.days).sort();while(keys.length>60)delete S.days[keys.shift()];
  return true;
}
function finishSession(){
  const s=sess,n=s.res.length,ok=s.res.filter(x=>x.ok).length;
  s.okCount=ok;s.n=n;
  if(s.mode==='test'){
    s.res.forEach(x=>{record(x.task,x.ok);if(!x.ok)addError(x.task);});
    S.stars+=ok;s.stars=ok;
    s.note=noteFor(ok,n);if(s.note===1)S.badges.note1++;
    S.tests.push({s:s.label||'Probe',ok,n,note:s.note});if(S.tests.length>20)S.tests.shift();
  }
  if(s.mode==='mission')s.firstMission=completeMission(ok,n);
  s.lvUp=levelOf(S.stars).i>s.lv0?levelOf(S.stars).name:null;
  s.joke=pick1(JOKES);s.done=true;save();render();window.scrollTo(0,0);
}
function shortQ(t){const p=plain(t.q);return p.length>120?p.slice(0,120)+'…':p;}
function renderSummary(){
  const s=sess,n=s.n,ok=s.okCount,all=ok===n;
  let h='';
  if(s.mode==='test'){
    h+='<section class="card sum"><div class="eyebrow">'+esc(s.label||'Probe-Arbeit')+'</div><div class="note-big" aria-label="Note '+s.note+'">'+s.note+'</div><h1>'+ok+' von '+n+' richtig</h1><p class="muted" style="margin:0">'+(s.note<=2?'Sehr gut! Plusi tanzt.':s.note<=4?'Solide. Mit dem Fehlerheft wird es noch besser.':'Das war schwer. Schau dir die Lösungswege an und übe das Thema in Ruhe.')+' Das ist nur eine Übungsnote, keine echte.</p><span class="earn">'+STAR+'+'+s.stars+' Sterne</span></section>';
  }else{
    h+='<section class="card sum">'+plusi(all?'cheer':'happy','hop')+'<h1>'+(s.mode==='mission'?(all?'Mission perfekt!':'Mission geschafft!'):all?'Alles richtig!':'Runde geschafft!')+'</h1><div class="big">'+ok+' / '+n+'</div><span class="earn">'+STAR+'+'+s.stars+(s.mode==='mission'&&s.firstMission?' + 5 Bonus':'')+' Sterne</span>';
    if(s.mode==='mission'&&s.firstMission)h+='<p style="margin:0;font-weight:800">'+FLAME.replace('<svg','<svg style="width:22px;height:22px;vertical-align:-4px"')+' '+S.streak+(S.streak===1?' Tag':' Tage')+' in Folge. Komm morgen wieder!</p>';
    if(s.lvUp)h+='<div class="joke" style="background:var(--good-bg)">Level-Up! Du bist jetzt <b>'+esc(s.lvUp)+'</b>.</div>';
    if(s.mode==='mission'||s.mode==='bonus')h+='<div class="joke"><div class="eyebrow" style="margin-bottom:4px">Plusis Witz</div>'+esc(s.joke)+'</div>';
    h+='</section>';
  }
  h+='<section class="card"><ul class="rlist">'+s.res.map((x,i)=>'<li class="'+(x.ok?'ok':'no')+'"><span class="mk" aria-label="'+(x.ok?'richtig':'falsch')+'">'+(x.ok?'✓':'✕')+'</span><div class="tx">'+esc(shortQ(x.task))+(x.ok?'':'<br><b>Richtig: '+answerHtml(x.task)+'</b>'+(s.mode==='test'?'<details class="solution"><summary>Lösungsweg</summary>'+heft(x.task.steps)+'</details>':''))+'</div></li>').join('')+'</ul></section>';
  h+='<div class="row"><button class="btn grow" data-act="tab" data-v="home">Fertig</button>'+(s.res.some(x=>!x.ok)?'<button class="btn ghost grow" data-act="tab" data-v="errors">Fehlerheft</button>':'')+'</div>';
  $('#view').innerHTML=h;
}

/* ---------- Zeichnen ---------- */
function render(){
  document.body.classList.toggle('in-session',!!sess);
  if(sess)renderSession();
  else{
    const V={home:homeView,practice:practiceView,topic:topicView,test:testView,errors:errorsView,awards:awardsView};
    $('#view').innerHTML=V[view]();
  }
  renderTabs();
}

/* ---------- Ereignisse ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,D=b.dataset;
  switch(a){
    case 'tab':go(D.v);break;
    case 'pgrade':go('practice',+D.g);break;
    case 'tgrade':go('test',+D.g);break;
    case 'topic':go('topic',D.id);break;
    case 'practice':startSession('practice',practiceTasks(D.id,8),{label:TOPIC[D.id].title});break;
    case 'testtopic':startSession('test',testTasks(D.id,S.grade),{label:'Probe: '+TOPIC[D.id].title});break;
    case 'testmix':startSession('test',testTasks('mix',+D.g),{label:'Probe Klasse '+D.g+' gemischt'});break;
    case 'mission':startSession('mission',buildMission(S.grade,todayStr(),false).tasks);break;
    case 'bonus':startSession('bonus',buildMission(S.grade,todayStr(),true).tasks);break;
    case 'errs':startSession('errors',errorTasks());break;
    case 'setgrade-draft':{draftGrade=+D.g;document.querySelectorAll('[data-act="setgrade-draft"]').forEach(x=>x.setAttribute('aria-pressed',String(+x.dataset.g===draftGrade)));break;}
    case 'saveprofile':{const nm=($('#pname')||{value:S.name}).value.trim().slice(0,20);S.name=nm;if(draftGrade)S.grade=draftGrade;draftGrade=null;S.seen=true;save();render();break;}
    case 'resetask':confirmReset=true;render();break;
    case 'resetno':confirmReset=false;render();break;
    case 'resetyes':S=fresh();S.seen=false;save();confirmReset=false;go('home');break;
    case 'quit':$('#quit').hidden=false;break;
    case 'quitno':$('#quit').hidden=true;break;
    case 'quityes':sess=null;render();window.scrollTo(0,0);break;
    case 'tip':showTip();break;
    case 'show':showSolution();break;
    case 'check':submit();break;
    case 'next':advance();break;
    case 'minus':{const i=$('#ans');if(i&&!i.value.startsWith('−')&&!i.value.startsWith('-')){i.value='−'+i.value;}i&&i.focus();break;}
    case 'pick':{sess.sel=+D.i;document.querySelectorAll('.choice').forEach((x,i)=>x.setAttribute('aria-pressed',String(i===sess.sel)));break;}
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='an'||el.id==='ad')el.value=el.value.replace(/\D/g,'').slice(0,3);
  else if(el.id==='ans')el.value=el.value.replace(/[^\d,.\-−\s ]/g,'');
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!sess||sess.done)return;
  if(e.target.closest&&e.target.closest('button'))return;
  e.preventDefault();
  if(sess.phase==='ask')submit();else advance();
});

render();
})();

</script>
